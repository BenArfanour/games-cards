name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (make test, make stan, make cs)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for PHP container
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T php php -r 'exit(0);' && exit 0
            sleep 2
          done
          echo "PHP container did not become ready in time"
          exit 1

      - name: Install dependencies
        run: make install

      - name: Run tests (PHPUnit)
        run: make test

      - name: Run static analysis (PHPStan)
        run: make stan

      - name: Check code style (PHP-CS-Fixer dry-run)
        run: make cs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
