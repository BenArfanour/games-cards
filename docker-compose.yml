services:
  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html:cached
    working_dir: /var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
